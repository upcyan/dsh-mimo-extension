# The `mimo` agent preset (dsh-mimo-extension): a MiMo-tuned coding agent.
#
# 结构参考 dsh-glm-mode（MIT, Copyright (c) 2026 hoyyang）的 glm 预设 ——
# 该形态（PTC 呈现 + 预设内隔离压缩 owner）已在其作者环境长期验证。
#
# Design notes:
#   - Based on the built-in PTC preset: the FULL standard tool catalog
#     presented through Code Mode (programmatic tool calling) — the model
#     composes multi-step operations in one TypeScript program instead of
#     per-call JSON round trips, cutting input tokens (Credits on Token Plan).
#   - Wire-level tuning lives on the llm-pi-ai mimo routes (settings.yaml).
#     The vision declaration for mimo models is handled by this plugin's
#     vision routing (settings write), not by the preset.
#   - Compaction: this preset publishes its OWN isolated compaction owner
#     (mimo thresholds 0.75/0.22 — mimo-v2.6-flash is a 1M-context model) —
#     the designed "nearest owner wins" seam: deterministic regardless of
#     which host plugin mounted a host-plane engine first. After compaction
#     the engine swaps history for a summary; the persona instructs the
#     model to continue seamlessly from it.
#   - Request-cache stability: the PTC catalog is frozen for the session
#     (plan mode keeps it unchanged), and the persona only embeds
#     {{model}}/{{cwd}} — the implicit prefix cache (verified live:
#     cached_tokens on repeat prefixes) stays warm. Switching presets
#     rebuilds the prefix once; within a session nothing shifts.
#
# A service row here MUST sit inside a group carrying an `isolate` realm
# (see the shipped `standard`/`code` presets for the full rationale).

# ── identity ────────────────────────────────────────────────────────────────

- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    prefix: >-
      You are a coding agent powered by the {{model}} model (MiMo v2.6 series, natively multimodal: read images and screenshots the user attaches directly instead of claiming you cannot see them).. Your working directory is {{cwd}}.
      Keep execution lifecycles tight: use a background continuable subagent only when parallel work or a later follow-up is genuinely useful; for a one-shot delegation whose result is needed now and will not be reused, set run_in_background to false so the run is awaited and its live resources are disposed before continuing. Interrupt a running subagent once its remaining work is no longer needed. Collect completed background jobs, kill jobs that stopped mattering, and leave no relevant job running when the task ends. A ready subagent is storage-only resumable history, not live work, so do not delete or restart it merely to clean up resources.
      When several tool calls are independent, issue them in the same turn as parallel calls: it cuts round trips and your per-turn thinking overhead. Keep tool call arguments compact — defer to file paths and identifiers rather than re-pasting large content.
      When an automatic context compaction happens, the earlier conversation is replaced by a summary in place: treat that summary as your durable memory and continue the task from it without asking the user to repeat anything.

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

# ── shell ───────────────────────────────────────────────────────────────────

- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  disabled: !!js process.platform === 'win32'

- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: !!js process.platform !== 'win32'

# ── filesystem ──────────────────────────────────────────────────────────────

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

# ── background jobs ────────────────────────────────────────────────────────

- id: tool-jobs
  name: '@deepseek-ai/dsh-tool-jobs'

# ── skills ──────────────────────────────────────────────────────────────────

- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

# ── goals ───────────────────────────────────────────────────────────────────

- id: tool-goal
  name: '@deepseek-ai/dsh-tool-goal'

# ── plan mode ───────────────────────────────────────────────────────────────

- id: planning
  name: cordis:group
  group: true
  isolate:
    planMode: true
  config:
    - id: plan-mode
      name: '@deepseek-ai/dsh-plan-mode'
      config:
        section: |
              You are in plan mode. Stay in plan mode until exit_plan_mode succeeds or the user switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

              Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

              The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

              Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

              Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

              When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.

# ── compaction ──────────────────────────────────────────────────────────────

# MiMo 自动压缩（Codex 式）：预设内自带隔离 owner —— 官方 "nearest owner
# wins" 语义，host 平面的兜底引擎对本预设会话自动退位，杜绝双引擎
# 阈值冲突。压缩引擎把早期历史换成原地摘要后任务无缝续跑（persona 已配套指令）。
#
# `compaction-basic` reads `toolResultPrune` through `ctx.get`, so the pruner
# must share this realm rather than sit outside it. `tokenMeter` deliberately
# stays on the HOST plane (see the shipped `standard` preset rationale).
#
# 阈值：mimo-v2.6-flash 上下文 1M，75% 触发 / 保留 22%——与 Kiro 模式同哲学，
# 给压缩摘要 + 续跑留出充足余量；推理型模型压缩后重放前缀仍命中隐式缓存。
- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'
      config:
        thresholdRatio: 0.75
        retainRatio: 0.22
        maxTokens: 8192
        compactionRetries: 1
        maxOverflowRetries: 1

    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'

    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024

# ── delegation and workflows ────────────────────────────────────────────────

- id: delegation
  name: cordis:group
  group: true
  isolate:
    workflowEngine: true
  config:
    - id: tool-subagent-control
      name: '@deepseek-ai/dsh-tool-subagent-control'

    - id: tool-subagent-list-agents
      name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'

    - id: tool-subagent
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: subagent
        backgroundMode: continuable

    - id: tool-subagent-fork
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: fork
        toolName: subagent_fork
        backgroundMode: continuable

    - id: tool-subagent-codex
      name: '@deepseek-ai/dsh-tool-subagent'
      disabled: true
      config:
        provider: codex
        toolName: subagent_codex
        backgroundMode: one-shot
        maxDepth: provider-managed

    - id: tool-subagent-claude-code
      name: '@deepseek-ai/dsh-tool-subagent'
      disabled: true
      config:
        provider: claude-code
        toolName: subagent_claude_code
        backgroundMode: one-shot
        maxDepth: provider-managed

    - id: workflow-worker-thread
      name: '@deepseek-ai/dsh-workflow-worker-thread'
      config:
        provider: spawn

    - id: tool-workflow
      name: '@deepseek-ai/dsh-tool-workflow'

    - id: tool-ralph
      name: '@deepseek-ai/dsh-tool-ralph'
      config:
        subagentProvider: spawn
        maxRounds: 64

# ── remaining model-facing rows ─────────────────────────────────────────────

- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: false
    searchTimeoutMs: 60000

# ── presentation ────────────────────────────────────────────────────────────

# PTC (Code Mode) for this agent alone, mirroring the shipped `code` preset:
# the full standard catalog is presented through the Code Mode SDK so the
# model composes multi-step operations in one TypeScript program. The row
# waits for the host's `codeRuntime` rather than assuming it: a deployment
# that composes no TypeScript runtime fails this preset at mount, naming this
# id, instead of at the first request. (This deployment's web composition
# ships `code-runtime` — verified via `dsh --profile web --dump-config`.)
- id: tool-presentation
  name: '@deepseek-ai/dsh-agent-tool-presentation'
  config:
    mode: ptc
